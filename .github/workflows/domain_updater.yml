name: Auto Domain Updater

on:
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours
  workflow_dispatch:      # Allow manual trigger from GitHub UI

permissions:
  contents: write         # Required to push changes back to repository

jobs:
  update-domains:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nodriver

    - name: Diagnose Chrome
      run: |
        which google-chrome || true
        google-chrome --version || true
        google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom https://www.google.com | head -n 5 || true

    - name: Run Address Updater
      run: |
        xvfb-run python github_domain_updater.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add domain.txt
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "No changes detected."
        else
          CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "chore: auto-update domain.txt - $CURRENT_TIME [skip ci]"
          git push
        fi
